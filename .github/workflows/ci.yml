name: CI MEMTRACE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt

    - name: Contrôle de style (Exigence ENF-06)
      run: |
        # Vérifie les erreurs critiques de syntaxe
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Affiche le reste sous forme d'avertissements
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Exécution des tests et sécurité (Exigences ENF-05 et ENF-07)
      run: |
        python -m pytest tests/ -v

  build-docker:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Construction de l'image Docker (Exigence ENF-06)
      run: docker build -t memtrace-app .